# GitHub Actions CI：每次 push / 提 PR 都自动跑一遍测试，保证仓库常绿。
# 测试用 FakeLLM 伪模型，不需要真实 API key。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python myone_agent1/run_tests.py
